<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="50%" stop-color="#F6F0E7" />
      <stop offset="100%" stop-color="#EFE7DC" />
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA756A" />
      <stop offset="100%" stop-color="#D64436" />
    </linearGradient>

    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA094" />
      <stop offset="100%" stop-color="#C93C2F" />
    </linearGradient>

    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F78579" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#E2D5C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F78579" stop-opacity="0.75" />
    </linearGradient>

    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F77265" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#F77265" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#F77265" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#6B5442" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGradient)" />
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.25" fill="none" stroke="#E6DED2" stroke-width="1.5" />

  <!-- Left Editorial Content Section -->
  <g transform="translate(80, 54)">
    <!-- Category Pill Badge -->
    <rect width="144" height="28" rx="14" fill="#F8ECE8" stroke="#F1D0C7" stroke-width="1" />
    <circle cx="16" cy="14" r="3.5" fill="#E0564C">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B93D32" letter-spacing="0.06em">OPEN SOURCE</text>

    <!-- Main Title with Subtle Animated Blinking Caret -->
    <g transform="translate(0, 82)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="750" fill="#1D1A18" letter-spacing="-0.025em">Hi, I'm jiassia.</text>
      <rect x="316" y="-34" width="3" height="38" rx="1.5" fill="#E0564C">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Tagline -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#D94F43" letter-spacing="-0.01em">Small tools. Thoughtful details.</text>

    <!-- Subline -->
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6A625A" letter-spacing="0.01em">Open source · Automation · Practical software.</text>

    <!-- Decorative Accent Line -->
    <g transform="translate(0, 198)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#E0564C" stroke-width="2.5" stroke-linecap="round" />
      <line x1="72" y1="0" x2="340" y2="0" stroke="#E3DACF" stroke-width="1" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Dimensional Graphic Section with Subtle Floating Geometric Motion -->
  <g transform="translate(740, 44)">
    <animateTransform attributeName="transform" type="translate" values="740 44; 740 40; 740 44" dur="6s" repeatCount="indefinite" />

    <!-- Soft Ambient Radial Glow -->
    <ellipse cx="190" cy="116" rx="170" ry="120" fill="url(#coralGlow)" />

    <!-- Floating Dimensional Container Card -->
    <rect x="0" y="0" width="380" height="232" rx="16" fill="#FFFFFF" fill-opacity="0.82" stroke="#EAE1D6" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Window Controls & Header -->
    <circle cx="24" cy="22" r="4.5" fill="#F07C72" />
    <circle cx="40" cy="22" r="4.5" fill="#E8D9CE" />
    <circle cx="56" cy="22" r="4.5" fill="#E8D9CE" />
    <line x1="80" y1="22" x2="160" y2="22" stroke="#EFE7DE" stroke-width="2" stroke-linecap="round" />

    <!-- Isometric Wireframe Grid Underlay -->
    <g stroke="#F1EAE0" stroke-width="1" stroke-dasharray="3 3" opacity="0.9">
      <line x1="40" y1="170" x2="180" y2="90" />
      <line x1="80" y1="190" x2="220" y2="110" />
      <line x1="120" y1="210" x2="260" y2="130" />
      <line x1="160" y1="230" x2="300" y2="150" />
      <line x1="100" y1="90" x2="240" y2="170" />
      <line x1="140" y1="110" x2="280" y2="190" />
      <line x1="180" y1="130" x2="320" y2="210" />
    </g>

    <!-- Dimensional Orbital Rings with Subtle Rotation/Dash Motion -->
    <g transform="rotate(-15 190 118)">
      <ellipse cx="190" cy="118" rx="140" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" values="0;28" dur="4s" repeatCount="indefinite" />
      </ellipse>
    </g>
    <g transform="rotate(18 190 118)">
      <ellipse cx="190" cy="118" rx="95" ry="48" fill="none" stroke="#F5B9B1" stroke-width="1" stroke-dasharray="3 5">
        <animate attributeName="stroke-dashoffset" values="16;0" dur="5s" repeatCount="indefinite" />
      </ellipse>
    </g>

    <!-- Floating Accent Cube (Top-Right) with Subtle Vertical Bob -->
    <g transform="translate(310, 52)">
      <animateTransform attributeName="transform" type="translate" values="310 52; 310 47; 310 52" dur="4s" repeatCount="indefinite" />
      <!-- Top face -->
      <path d="M 0 -10 L 16 -2 L 0 6 L -16 -2 Z" fill="#FFA59B" />
      <!-- Left face -->
      <path d="M -16 -2 L 0 6 L 0 24 L -16 16 Z" fill="#E55B4F" />
      <!-- Right face -->
      <path d="M 0 6 L 16 -2 L 16 16 L 0 24 Z" fill="#BA3E34" />
    </g>

    <!-- Floating Muted Cube (Bottom-Left) -->
    <g transform="translate(54, 156)">
      <animateTransform attributeName="transform" type="translate" values="54 156; 54 160; 54 156" dur="4.5s" repeatCount="indefinite" />
      <!-- Top face -->
      <path d="M 0 -7 L 12 -1 L 0 5 L -12 -1 Z" fill="#FAF6F0" />
      <!-- Left face -->
      <path d="M -12 -1 L 0 5 L 0 18 L -12 12 Z" fill="#E3DACE" />
      <!-- Right face -->
      <path d="M 0 5 L 12 -1 L 12 12 L 0 18 Z" fill="#CDC2B5" />
    </g>

    <!-- Centerpiece: Dimensional 3D Faceted Code Symbol < / > -->
    <g transform="translate(190, 118)">
      <!-- Bracket < (Layered with dimensional facets) -->
      <g transform="translate(-62, 0)">
        <!-- Light-catching Top Bevel -->
        <path d="M 14 -38 L -16 -8 L -16 -4 L 14 -34 Z" fill="#FFB2A8" />
        <path d="M -30 -4 L -16 -8 L -16 -4 L -30 0 Z" fill="#FFC6BD" />
        <!-- Front Main Face -->
        <path d="M 14 -34 L -16 -4 L -16 4 L 14 34 L 1 34 L -30 3 L -30 -3 L 1 -34 Z" fill="url(#coralGrad)" />
        <!-- Lower Drop Shadow Face -->
        <path d="M -16 4 L 14 34 L 14 38 L -16 8 Z" fill="#A83226" />
      </g>

      <!-- Oblique Slash / (Faceted Pillar) -->
      <g transform="translate(0, 0)">
        <!-- Top Cap Face -->
        <path d="M 9 -44 L 15 -41 L 21 -44 L 15 -47 Z" fill="#FFD2CC" />
        <!-- Front Main Face -->
        <path d="M 10 -44 L 20 -44 L -10 44 L -20 44 Z" fill="url(#roseGoldGrad)" />
        <!-- Side Extrusion Face -->
        <path d="M 20 -44 L 25 -41 L -5 47 L -10 44 Z" fill="#9C3026" />
      </g>

      <!-- Bracket > (Layered with dimensional facets) -->
      <g transform="translate(62, 0)">
        <!-- Light-catching Top Bevel -->
        <path d="M -14 -38 L 16 -8 L 30 0 L 16 -4 L -14 -34 Z" fill="#FFB2A8" />
        <!-- Front Main Face -->
        <path d="M -14 -34 L 16 -4 L 16 4 L -14 34 L -1 34 L 30 3 L 30 -3 L -1 -34 Z" fill="url(#coralGrad)" />
        <!-- Lower Drop Shadow Face -->
        <path d="M 16 4 L -14 34 L -14 38 L 16 8 Z" fill="#A83226" />
      </g>
    </g>

    <!-- Orbital Node Indicators -->
    <circle cx="84" cy="86" r="3.5" fill="#E0564C" />
    <circle cx="298" cy="148" r="4" fill="#E0564C" />
    <circle cx="246" cy="78" r="2.5" fill="#E88F84" />

    <!-- Bottom Interface Status Strip -->
    <rect x="24" y="194" width="332" height="20" rx="5" fill="#FBF8F3" stroke="#EFE8DE" stroke-width="1" />
    <text x="36" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" fill="#8E8478" letter-spacing="0.08em">DESIGNED FOR WORKFLOWS</text>
    <text x="328" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="700" fill="#E0564C" letter-spacing="0.05em">PROD</text>
  </g>
</svg>
