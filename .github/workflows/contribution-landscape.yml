name: Update contribution landscape

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-landscape
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-contributions.mjs "$RUNNER_TEMP/contributions.json"
      - name: Draw contribution landscape
        run: node scripts/generate-landscape.mjs "$RUNNER_TEMP/contributions.json"
      - name: Save updated landscape
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-landscape.svg
          if git diff --cached --quiet; then
            echo 'Contribution landscape is already current.'
            exit 0
          fi
          git commit -m 'Update contribution landscape'
          git push
