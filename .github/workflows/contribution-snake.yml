name: Update contribution animation

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate animation from GitHub contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: jiassia
          outputs: |
            assets/github-snake.svg?color_snake=%23e94262&color_dots=%23ebedf0,%23fbc6d0,%23f792a7,%23ed6082,%23ce3156
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23ff7896
      - name: Save updated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution animation is already current.'
            exit 0
          fi
          git commit -m 'Update contribution animation'
          git push
